name: Daily Check-in

on:
  schedule:
    # 4:45 sáng giờ Việt Nam (GMT+7) = 21:45 UTC ngày hôm trước
    - cron: '45 21 * * *'
  workflow_dispatch:  # Cho phép chạy manual

permissions:
  contents: read

# Một instance tại một thời điểm; run mới xếp hàng chờ, không hủy run đang
# điểm danh/redeem dở (thao tác không idempotent).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    environment: live
    timeout-minutes: 30

    # Secrets khai báo tường minh (least privilege) — KHÔNG dùng toJSON(secrets)
    # để tránh đưa toàn bộ secrets (kể cả GITHUB_TOKEN) vào runtime.
    # Secret chưa định nghĩa -> rỗng -> được code bỏ qua (get_accounts_from_env).
    env:
      ACC_1: ${{ secrets.ACC_1 }}
      ACC_2: ${{ secrets.ACC_2 }}
      ACC_3: ${{ secrets.ACC_3 }}
      ACC_4: ${{ secrets.ACC_4 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python with pip cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check-in and redeem
        run: python -m src.main
